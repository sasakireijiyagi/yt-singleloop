<!DOCTYPE html>
<html><body>
<script>
var initialized = false;
var lastSentTs = -1;

function send(v) {
  window.parent.postMessage({
    isStreamlitMessage: true,
    type: "streamlit:setComponentValue",
    value: v,
    dataType: "json"
  }, "*");
}

window.parent.postMessage({
  isStreamlitMessage: true,
  type: "streamlit:setFrameHeight",
  height: 1
}, "*");

// yt_pending_save だけをポーリング（yt_current_times は不要）
setInterval(function() {
  var raw = localStorage.getItem("yt_pending_save");
  if (!raw) return;
  try {
    var data = JSON.parse(raw);
    var ts = data.ts || 0;
    if (ts === lastSentTs) return;
    lastSentTs = ts;
    localStorage.removeItem("yt_pending_save");
    send({ start: data.start, end: data.end, label: data.label || "", ts: ts });
  } catch(e) {
    localStorage.removeItem("yt_pending_save");
  }
}, 300);

window.addEventListener("message", function(e) {
  if (!e.data || e.data.type !== "streamlit:render") return;
  if (!initialized) {
    initialized = true;
    send(null); // スピナー解消のための初期値
  }
});

window.parent.postMessage({
  isStreamlitMessage: true,
  type: "streamlit:componentReady",
  apiVersion: 1
}, "*");
</script>
</body></html>
