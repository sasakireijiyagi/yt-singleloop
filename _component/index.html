<!DOCTYPE html>
<html><body>
<script>
var initialized = false;
var lastSentTs = -1;

function send(v) {
  window.parent.postMessage({
    isStreamlitMessage: true,
    type: "streamlit:setComponentValue",
    value: v,
    dataType: "json"
  }, "*");
}

// localStorage を 300ms ごとにポーリングし、保存データがあれば Python へ送る
setInterval(function() {
  var raw = localStorage.getItem("yt_pending_save");
  if (!raw) return;
  try {
    var data = JSON.parse(raw);
    var ts = data.ts || 0;
    if (ts === lastSentTs) return;   // 同じデータは送らない
    lastSentTs = ts;
    localStorage.removeItem("yt_pending_save");
    send(data);
  } catch(e) {
    localStorage.removeItem("yt_pending_save");
  }
}, 300);

// Streamlit から render が来たら初回だけ null を送ってスピナーを解消する
window.addEventListener("message", function(e) {
  if (!e.data || e.data.type !== "streamlit:render") return;
  if (!initialized) {
    initialized = true;
    send(null);
  }
});

window.parent.postMessage({
  isStreamlitMessage: true,
  type: "streamlit:componentReady",
  apiVersion: 1
}, "*");
</script>
</body></html>
